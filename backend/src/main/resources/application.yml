spring:
  datasource:
    url: jdbc:mysql://localhost:3306/timetable?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${TANGENT_COMMON_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080

app:
  cors:
    # 允许的跨域来源（逗号分隔）。默认 *；认证走请求头而非 Cookie，故不开启凭据。
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  # 可编辑全局作息时间表的账号 label（逗号分隔）
  admin-labels: ${ADMIN_LABELS:Tangent0712}

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # deepseek-flash 对应模型版本 DeepSeek-V4.1-Flash
    model: ${DEEPSEEK_MODEL:deepseek-flash}
